volumes:
  n8n_storage:
  postgres_storage:
  ollama_storage:
  qdrant_storage:
  open-webui:
  comfy_workspace:
  a1111_data:

networks:
  demo:
    name: demo            # create once: `docker network create demo`
    external: true

services:
  postgres:
    image: postgres:16-alpine
    networks: ['demo']
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-ai}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change_me}
      - POSTGRES_DB=${POSTGRES_DB:-ai_db}
    volumes:
      - postgres_storage:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER:-ai} -d ${POSTGRES_DB:-ai_db}']
      interval: 5s
      timeout: 5s
      retries: 10
    pull_policy: always

  n8n:
    image: n8nio/n8n:latest
    networks: ['demo']
    container_name: n8n
    restart: unless-stopped
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-ai}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-change_me}
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-changeme}
      - N8N_USER_MANAGEMENT_JWT_SECRET=${N8N_USER_MANAGEMENT_JWT_SECRET:-changeme}
    ports:
      - "5678:5678"
    volumes:
      - n8n_storage:/home/node/.n8n
      - ./n8n/backup:/backup
      - ./shared:/data/shared
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=demo"
      - "traefik.http.routers.n8n.rule=Host(`${N8N_DOMAIN:-n8n.lab.home-cloud.uk}`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls=true"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
    depends_on:
      postgres:
        condition: service_healthy
    pull_policy: always

  ollama-gpu:
    image: ollama/ollama:latest
    container_name: ollama-gpu
    networks: ['demo']
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    pull_policy: always

  ollama-pull-llama-gpu:
    image: ollama/ollama:latest
    container_name: ollama-pull-llama-gpu
    networks: ['demo']
    volumes:
      - ollama_storage:/root/.ollama
    entrypoint: /bin/sh
    command: ["-c", "sleep 3; OLLAMA_HOST=ollama-gpu:11434 ollama pull llama3.3"]
    depends_on:
      ollama-gpu:
        condition: service_healthy
    pull_policy: always

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    networks: ['demo']
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    pull_policy: always

  # ---- Download ComfyUI model (runs once) ----
  comfyui-model-downloader:
    image: alpine:latest
    container_name: comfyui-model-downloader
    networks: ['demo']
    volumes:
      - comfy_workspace:/workspace
    command: >
      sh -c "
        echo 'Installing wget...' &&
        apk update &&
        apk add --no-cache wget curl &&
        echo 'Creating directories...' &&
        mkdir -p /workspace/ComfyUI/models/checkpoints &&
        if [ ! -f /workspace/ComfyUI/models/checkpoints/sdxl_turbo_1.0_fp16.safetensors ]; then
          echo 'Downloading SDXL Turbo model for RTX 3060 (6.9GB)...' &&
          wget --progress=dot:giga -O /workspace/ComfyUI/models/checkpoints/sdxl_turbo_1.0_fp16.safetensors \
            'https://huggingface.co/stabilityai/sdxl-turbo/resolve/main/sd_xl_turbo_1.0_fp16.safetensors' &&
          echo 'Model download completed!' &&
          ls -lh /workspace/ComfyUI/models/checkpoints/
        else
          echo 'Model already exists, skipping download.' &&
          ls -lh /workspace/ComfyUI/models/checkpoints/
        fi
      "
    restart: "no"

  # ---- ComfyUI (GPU) - Force ComfyUI to actually start ----
  comfyui:
    image: ghcr.io/ai-dock/comfyui:latest-cuda
    container_name: comfyui
    networks: ['demo']
    restart: unless-stopped
    ports:
      - "8188:8188"  # Expose port for debugging/direct access
    volumes:
      - comfy_workspace:/workspace
      # Mount models directory for easier management
      - ./models/comfy:/workspace/ComfyUI/models
      - ./output/comfy:/workspace/ComfyUI/output
    environment:
      # Disable all the extra services that are interfering
      WEB_ENABLE_AUTH: "false"
      WEB_ENABLE_QUICKTUNNEL: "false"
      WEB_ENABLE_LOGIN: "false"
      WORKSPACE: "/workspace"
      # Force only ComfyUI to start
      SUPERVISOR_START_COMFYUI: "true"
      AUTO_UPDATE: "false"
      # Disable other services
      SERVICE_SYNCTHING: "false"
      SERVICE_RCLONE: "false"
      SERVICE_OPENSSH: "false"
      # ComfyUI specific settings
      COMFYUI_FLAGS: "--listen 0.0.0.0 --port 8188"
    # Download model and start ComfyUI
    command: >
      bash -c "
        echo 'Setting up ComfyUI...' &&
        cd /workspace/ComfyUI &&
        mkdir -p models/checkpoints &&
        if [ ! -f models/checkpoints/sdxl_turbo_1.0_fp16.safetensors ]; then
          echo 'Downloading SDXL Turbo model (6.9GB)...' &&
          wget --progress=dot:giga -O models/checkpoints/sdxl_turbo_1.0_fp16.safetensors \
            'https://huggingface.co/stabilityai/sdxl-turbo/resolve/main/sd_xl_turbo_1.0_fp16.safetensors' &&
          echo 'Model download completed!'
        fi &&
        echo 'Starting ComfyUI server...' &&
        python main.py --listen 0.0.0.0 --port 8188 --preview-method auto --verbose
      "
    depends_on: []
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8188/system_stats || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 15
      start_period: 180s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=demo"
      - "traefik.http.routers.comfyui.rule=Host(`${COMFY_DOMAIN:-cui.lab.home-cloud.uk}`)"
      - "traefik.http.routers.comfyui.entrypoints=websecure"
      - "traefik.http.routers.comfyui.tls=true"
      - "traefik.http.services.comfyui.loadbalancer.server.port=8188"
    pull_policy: always

  # ---- AUTOMATIC1111 (GPU) ----
  automatic1111:
    image: ghcr.io/ai-dock/stable-diffusion-webui:latest-cuda
    container_name: automatic1111
    networks: ['demo']
    restart: unless-stopped
    environment:
      # --api is required for Open WebUI
      CLI_ARGS: "--listen --port 7860 --api --enable-insecure-extension-access --no-half-vae"
    ports:
      - "7860:7860"
    volumes:
      - a1111_data:/data
      # Optional: bind host model folders:
      # - ./models/a1111:/data/models
      # - ./output/a1111:/data/outputs
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7860/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    pull_policy: always

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    networks: ['demo']
    restart: unless-stopped
    # Remove port mapping - access via Traefik only
    depends_on:
      ollama-gpu:
        condition: service_healthy
      comfyui:
        condition: service_healthy
      automatic1111:
        condition: service_healthy
    environment:
      # Chat LLM via Ollama
      OLLAMA_BASE_URL: "http://ollama-gpu:11434"
      # Image gen config (can be changed later in OWUI Admin → Settings → Images)
      ENABLE_IMAGE_GENERATION: "true"
      IMAGE_GENERATION_ENGINE: "comfyui"                 # default at boot; switch in UI if needed
      COMFYUI_BASE_URL: "http://comfyui:8188"
      AUTOMATIC1111_BASE_URL: "http://automatic1111:7860"
      # Additional Open WebUI settings
      WEBUI_NAME: "AI Chat & Image Generation"
      DEFAULT_USER_ROLE: "user"
      # Enable CORS for better API communication
      ENABLE_COMMUNITY_SHARING: "false"
    volumes:
      - open-webui:/app/backend/data
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=demo"
      - "traefik.http.routers.chat.rule=Host(`${WEBUI_DOMAIN:-chat.lab.home-cloud.uk}`)"
      - "traefik.http.routers.chat.entrypoints=websecure"
      - "traefik.http.routers.chat.tls=true"
      - "traefik.http.services.chat.loadbalancer.server.port=8080"
    pull_policy: always
