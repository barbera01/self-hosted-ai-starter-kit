#!/usr/bin/env python3
"""
Simple TTS Service using Google Text-to-Speech
Save this as simple-tts.py in your project root
"""

from fastapi import FastAPI, HTTPException
from fastapi.responses import FileResponse
from pydantic import BaseModel
from gtts import gTTS
import os
import hashlib
import tempfile
import logging

logging.basicConfig(level=logging.INFO)
logger = logging.getLogger(__name__)

class TTSRequest(BaseModel):
    text: str
    language: str = "en"
    slow: bool = False

app = FastAPI(title="Simple TTS Service", version="1.0.0")

@app.get("/")
async def root():
    return {"message": "Simple TTS Service is running"}

@app.get("/health")
async def health():
    return {"status": "healthy"}

@app.post("/tts")
async def text_to_speech(request: TTSRequest):
    """Convert text to speech using Google TTS"""
    try:
        # Create output directory
        os.makedirs("/app/output", exist_ok=True)
        
        # Generate filename
        text_hash = hashlib.md5(request.text.encode()).hexdigest()[:8]
        filename = f"tts_{text_hash}.mp3"
        filepath = f"/app/output/{filename}"
        
        # Check if file already exists
        if os.path.exists(filepath):
            return {"filename": filename, "url": f"/download/{filename}"}
        
        # Generate speech
        tts = gTTS(text=request.text, lang=request.language, slow=request.slow)
        tts.save(filepath)
        
        logger.info(f"Generated TTS for text: {request.text[:50]}...")
        
        return {"filename": filename, "url": f"/download/{filename}"}
        
    except Exception as e:
        logger.error(f"TTS generation failed: {e}")
        raise HTTPException(status_code=500, detail=f"TTS generation failed: {str(e)}")

@app.get("/download/{filename}")
async def download_audio(filename: str):
    """Download generated audio file"""
    filepath = f"/app/output/{filename}"
    
    if not os.path.exists(filepath):
        raise HTTPException(status_code=404, detail="Audio file not found")
    
    return FileResponse(
        filepath,
        media_type='audio/mpeg',
        filename=filename
    )

@app.get("/list")
async def list_audio_files():
    """List all generated audio files"""
    output_dir = "/app/output"
    if not os.path.exists(output_dir):
        return {"files": []}
    
    files = []
    for filename in os.listdir(output_dir):
        if filename.endswith('.mp3'):
            files.append({
                "filename": filename,
                "url": f"/download/{filename}"
            })
    
    return {"files": files}

if __name__ == "__main__":
    import uvicorn
    uvicorn.run(app, host="0.0.0.0", port=5002)
