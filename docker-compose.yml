# version: "3.9"  # Removed as it's obsolete

volumes:
  n8n_storage:
  postgres_storage:
  ollama_storage:
  qdrant_storage:
  open-webui:
  comfy_workspace:
  a1111_data:
  # Simple avatar volumes
  avatar_input:
  avatar_output:
  tts_output:
  # Kokoro volumes
  kokoro_models:
  kokoro_cache:
  kokoro_web_cache:
  # Whisper volumes
  whisper_audio:

networks:
  demo:
    name: demo
    external: true

services:
  postgres:
    image: postgres:16-alpine
    networks: ["demo"]
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_INITDB_ARGS="--auth-host=scram-sha-256"
    volumes:
      - postgres_storage:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    pull_policy: missing

  postgres-setup:
    image: postgres:16-alpine
    networks: ["demo"]
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_NON_ROOT_USER=${POSTGRES_NON_ROOT_USER}
      - POSTGRES_NON_ROOT_PASSWORD=${POSTGRES_NON_ROOT_PASSWORD}
    command: >
      sh -c "
      until pg_isready -h postgres -U $$POSTGRES_USER -d $$POSTGRES_DB; do
        echo 'Waiting for postgres...'; sleep 2;
      done;
      echo 'Creating n8n user...';
      psql -h postgres -U $$POSTGRES_USER -d $$POSTGRES_DB -c \"
        CREATE USER $$POSTGRES_NON_ROOT_USER WITH PASSWORD '$$POSTGRES_NON_ROOT_PASSWORD';
        GRANT ALL PRIVILEGES ON DATABASE $$POSTGRES_DB TO $$POSTGRES_NON_ROOT_USER;
        GRANT ALL PRIVILEGES ON SCHEMA public TO $$POSTGRES_NON_ROOT_USER;
        ALTER USER $$POSTGRES_NON_ROOT_USER CREATEDB;
      \" || echo 'User may already exist';
      echo 'Setup completed';
      "
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    pull_policy: missing

  n8n:
    image: n8nio/n8n:1.81.0
    networks: ["demo"]
    container_name: n8n
    restart: unless-stopped
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_USER=${POSTGRES_NON_ROOT_USER:-n8n}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_NON_ROOT_PASSWORD:-REDACTED_PASSWORD}
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n}
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-changeme}
      - N8N_USER_MANAGEMENT_JWT_SECRET=${N8N_USER_MANAGEMENT_JWT_SECRET:-changeme}
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    ports:
      - "5678:5678"
    volumes:
      - n8n_storage:/home/node/.n8n
      - ./n8n/backup:/backup
      - ./shared:/data/shared
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=demo"
      - "traefik.http.routers.n8n.rule=Host(`${N8N_DOMAIN:-n8n.lab.home-cloud.uk}`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls=true"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-setup:
        condition: service_completed_successfully
    pull_policy: missing

  ollama-gpu:
    image: ollama/ollama:latest
    container_name: ollama-gpu
    networks: ["demo"]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    environment:
      # Give CUDA + KV cache some headroom on a 12 GB 3060
      - OLLAMA_GPU_MEMORY_FRACTION=0.88
      # Concurrency: each stream needs its own KV cache in VRAM
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KEEP_ALIVE=30m
      # CPU-side threading hygiene
      - OMP_NUM_THREADS=16 # set ~ your physical cores
      - OPENBLAS_NUM_THREADS=1
      # Expose if you hit it remotely
      - OLLAMA_HOST=0.0.0.0:11434

    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama-pull-llama-gpu:
    image: ollama/ollama:latest
    container_name: ollama-pull-llama-gpu
    networks: ["demo"]
    volumes:
      - ollama_storage:/root/.ollama
    entrypoint: /bin/sh
    command:
      ["-c", "sleep 3; OLLAMA_HOST=ollama-gpu:11434 ollama pull llama3.3"]
    depends_on:
      ollama-gpu:
        condition: service_healthy
    pull_policy: missing

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    networks: ["demo"]
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    pull_policy: missing

  # ---- Kokoro TTS Backend - Latest GPU version for CUDA 12.9 ----
  kokoro-gpu:
    # Use latest GPU version now that you have CUDA 12.9
    image: ghcr.io/remsky/kokoro-fastapi-gpu:latest
    container_name: kokoro-gpu
    networks: ["demo"]
    restart: unless-stopped
    ports:
      - "8880:8880"
    volumes:
      - kokoro_models:/app/models
      - kokoro_cache:/app/cache
      - ./shared:/app/shared
    environment:
      - MODEL_CACHE_DIR=/app/models
      - WORKERS=2
      - MAX_CONCURRENT_REQUESTS=4
      - USE_GPU=true
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 4G
    shm_size: 2gb
    healthcheck:
      test:
        ["CMD", "sh", "-c", "curl -f http://localhost:8880/health || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 180s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=demo"
      - "traefik.http.routers.kokoro-api.rule=Host(`${KOKORO_API_DOMAIN:-kokoro-api.lab.home-cloud.uk}`)"
      - "traefik.http.routers.kokoro-api.entrypoints=websecure"
      - "traefik.http.routers.kokoro-api.tls=true"
      - "traefik.http.services.kokoro-api.loadbalancer.server.port=8880"
    pull_policy: missing

  # ---- Kokoro Web Frontend ----
  kokoro-web:
    image: ghcr.io/eduardolat/kokoro-web:latest
    container_name: kokoro-web
    networks: ["demo"]
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - kokoro_web_cache:/kokoro/cache
      - ./shared:/app/shared
    environment:
      - KW_SECRET_API_KEY=${KOKORO_API_KEY:-kokoro-local-gpu}
      - KW_PUBLIC_NO_TRACK=true
      - KOKORO_BACKEND_URL=http://kokoro-gpu:8880
    depends_on:
      kokoro-gpu:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=demo"
      - "traefik.http.routers.kokoro-web.rule=Host(`${KOKORO_WEB_DOMAIN:-tts.lab.home-cloud.uk}`)"
      - "traefik.http.routers.kokoro-web.entrypoints=websecure"
      - "traefik.http.routers.kokoro-web.tls=true"
      - "traefik.http.services.kokoro-web.loadbalancer.server.port=3000"
    pull_policy: missing

  # ---- ComfyUI (Official Build with GPU) ----
  comfyui:
    build:
      context: ./comfyui_build
      dockerfile: Dockerfile
    container_name: comfyui
    networks: ["demo"]
    restart: unless-stopped
    ports:
      - "8188:8188"
    volumes:
      - ./comfyui_custom_nodes:/app/ComfyUI/custom_nodes
      - ./comfyui_models:/app/ComfyUI/models
      - ./comfyui_input:/app/ComfyUI/input
      - ./comfyui_output:/app/ComfyUI/output
    environment:
      NVIDIA_VISIBLE_DEVICES: "0"
      CUDA_VISIBLE_DEVICES: "0"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 8G
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=demo"
      - "traefik.http.routers.comfyui.rule=Host(`${COMFY_DOMAIN:-cui.lab.home-cloud.uk}`)"
      - "traefik.http.routers.comfyui.entrypoints=websecure"
      - "traefik.http.routers.comfyui.tls=true"
      - "traefik.http.services.comfyui.loadbalancer.server.port=8188"
    pull_policy: missing
  # ---- AUTOMATIC1111 (GPU) ----
  automatic1111:
    image: ghcr.io/ai-dock/stable-diffusion-webui:latest-cuda
    container_name: automatic1111
    networks: ["demo"]
    restart: unless-stopped
    environment:
      CLI_ARGS: "--listen --port 7860 --api --enable-insecure-extension-access --no-half-vae --medvram"
      WEB_ENABLE_AUTH: "false"
      WEBUI_URL: ""
    ports:
      - "7860:7860"
    volumes:
      - a1111_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7860/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 6G # Reduced from 8G
    pull_policy: missing

  # ---- Open WebUI (Updated with Kokoro TTS integration) ----
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    networks: ["demo"]
    restart: unless-stopped
    depends_on:
      - ollama-gpu
      - kokoro-gpu
    environment:
      OLLAMA_BASE_URL: "http://ollama-gpu:11434"
      ENABLE_IMAGE_GENERATION: "true"
      IMAGE_GENERATION_ENGINE: "automatic1111"
      COMFYUI_BASE_URL: "http://comfyui:8188"
      AUTOMATIC1111_BASE_URL: "http://automatic1111:7860"
      # Kokoro TTS Integration
      AUDIO_TTS_ENABLED: "true"
      AUDIO_TTS_ENGINE: "openai"
      AUDIO_TTS_API_BASE_URL: "http://kokoro-gpu:8880/v1"
      AUDIO_TTS_API_KEY: "not-needed"
      AUDIO_TTS_MODEL: "kokoro"
      AUDIO_TTS_VOICE: "af_heart"
      # Whisper STT Integration
      AUDIO_STT_ENABLED: "true"
      AUDIO_STT_ENGINE: "whisper"
      AUDIO_STT_MODEL: "whisper-1"
      AUDIO_STT_OPENAI_API_BASE_URL: "http://whisper:9000"
      AUDIO_STT_OPENAI_API_KEY: "not-needed"
      WEBUI_NAME: "AI Chat, Image & Voice Generation"
      DEFAULT_USER_ROLE: "user"
      ENABLE_COMMUNITY_SHARING: "false"
    volumes:
      - open-webui:/app/backend/data
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=demo"
      - "traefik.http.routers.chat.rule=Host(`${WEBUI_DOMAIN:-chat.lab.home-cloud.uk}`)"
      - "traefik.http.routers.chat.entrypoints=websecure"
      - "traefik.http.routers.chat.tls=true"
      - "traefik.http.services.chat.loadbalancer.server.port=8080"
    pull_policy: missing

  # ---- SIMPLE TTS Service (Only if you want it) ----
  simple-tts:
    image: python:3.11-slim
    container_name: simple-tts
    networks: ["demo"]
    restart: unless-stopped
    ports:
      - "5002:5002"
    volumes:
      - tts_output:/app/output
      - ./simple-tts.py:/app/simple-tts.py
    working_dir: /app
    command: >
      bash -c "
      pip install fastapi uvicorn pydantic gtts &&
      python simple-tts.py
      "
    profiles: ["avatar"] # Only start with: docker-compose --profile avatar up
    pull_policy: missing

  # ---- SIMPLE Avatar API (Updated with Kokoro support) ----
  avatar-api:
    image: python:3.11-slim
    container_name: avatar-api
    networks: ["demo"]
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - avatar_input:/app/input
      - avatar_output:/app/output
      - tts_output:/app/audio
      - ./shared:/app/shared
      - ./avatar-api.py:/app/avatar-api.py
    working_dir: /app
    environment:
      - OLLAMA_URL=http://ollama-gpu:11434
      - TTS_URL=http://kokoro-gpu:8880/v1 # Use Kokoro instead of simple-tts
      - KOKORO_TTS_URL=http://kokoro-gpu:8880/v1
      - COMFYUI_URL=http://comfyui:8188
    command: >
      bash -c "
      pip install fastapi uvicorn aiohttp aiofiles python-multipart pillow &&
      python avatar-api.py
      "
    depends_on:
      - ollama-gpu
      - kokoro-gpu
    profiles: ["avatar"] # Only start with: docker-compose --profile avatar up
    pull_policy: missing

  # ---- OpenAI Whisper STT (Speech-to-Text) ----
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest-gpu
    container_name: whisper
    networks: ["demo"]
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - whisper_audio:/app/audio
    environment:
      - ASR_MODEL=base
      - ASR_ENGINE=openai_whisper
      - NVIDIA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 3G
    pull_policy: missing
