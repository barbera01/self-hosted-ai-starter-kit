version: "3.9"

volumes:
  n8n_storage:
  postgres_storage:
  ollama_storage:
  qdrant_storage:
  open-webui:
  comfy_workspace:
  a1111_data:

networks:
  demo:
    name: demo           # fixed name; create once: `docker network create demo`
    external: true

services:
  postgres:
    image: postgres:16-alpine
    networks: ['demo']
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-ai}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change_me}
      - POSTGRES_DB=${POSTGRES_DB:-ai_db}
    volumes:
      - postgres_storage:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER:-ai} -d ${POSTGRES_DB:-ai_db}']
      interval: 5s
      timeout: 5s
      retries: 10
    pull_policy: always

  n8n:
    image: n8nio/n8n:latest
    networks: ['demo']
    container_name: n8n
    restart: unless-stopped
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-ai}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-change_me}
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-changeme}
      - N8N_USER_MANAGEMENT_JWT_SECRET=${N8N_USER_MANAGEMENT_JWT_SECRET:-changeme}
    ports:
      - "5678:5678"
    volumes:
      - n8n_storage:/home/node/.n8n
      - ./n8n/backup:/backup
      - ./shared:/data/shared
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=demo"
      - "traefik.http.routers.n8n.rule=Host(`${N8N_DOMAIN:-n8n.lab.home-cloud.uk}`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls=true"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
    depends_on:
      postgres:
        condition: service_healthy
    pull_policy: always

  ollama-gpu:
    image: ollama/ollama:latest
    container_name: ollama-gpu
    networks: ['demo']
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    pull_policy: always

  ollama-pull-llama-gpu:
    image: ollama/ollama:latest
    container_name: ollama-pull-llama-gpu
    networks: ['demo']
    volumes:
      - ollama_storage:/root/.ollama
    entrypoint: /bin/sh
    command: ["-c", "sleep 3; OLLAMA_HOST=ollama-gpu:11434 ollama pull llama3.3"]
    depends_on:
      ollama-gpu:
        condition: service_healthy
    pull_policy: always

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    networks: ['demo']
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    pull_policy: always

  # Image generation engine (GPU): ComfyUI
  comfyui:
    image: ghcr.io/ai-dock/comfyui:latest-cuda
    container_name: comfyui
    networks: ['demo']
    restart: unless-stopped
    volumes:
      - comfy_workspace:/workspace
      # Optional: bind host model folders for easy management:
      # - ./models/comfy:/workspace/models
      # - ./output/comfy:/workspace/output
    environment:
      COMFYUI_PORT: "8188"                # run on 8188 inside container
      COMFYUI_FLAGS: "--listen --port 8188"  # force 0.0.0.0 and port
      WEB_ENABLE_AUTH: "false"
      WORKSPACE: "/workspace"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=demo"
      - "traefik.http.routers.cui.rule=Host(`${N8N_DOMAIN:-cui.lab.home-cloud.uk}`)"
      - "traefik.http.routers.cui.entrypoints=websecure"
      - "traefik.http.routers.cui.tls=true"
      - "traefik.http.services.cui.loadbalancer.server.port=18188"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    pull_policy: always
    # To expose ComfyUI via Traefik, add labels similar to open-webui and set Host(`comfy.lab.home-cloud.uk`)

  # Image generation engine (GPU): AUTOMATIC1111
  automatic1111:
    image: ghcr.io/ai-dock/stable-diffusion-webui:latest-cuda
    container_name: automatic1111
    networks: ['demo']
    restart: unless-stopped
    environment:
      # --api is REQUIRED for Open WebUI integration
      CLI_ARGS: "--listen --port 7860 --api --enable-insecure-extension-access --no-half-vae"
    # Optional: publish UI for direct access; otherwise rely on internal DNS from OWUI
    ports:
      - "7860:7860"
    volumes:
      - a1111_data:/data
      # Optional: bind host model folders:
      # - ./models/a1111:/data/models
      # - ./output/a1111:/data/outputs
    # Simple TCP healthcheck (no curl dependency)
    healthcheck:
      test: ["CMD-SHELL", "bash -lc '</dev/tcp/127.0.0.1/7860' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 40
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    pull_policy: always

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    networks: ['demo']
    restart: unless-stopped
    depends_on:
      - ollama-gpu
      - comfyui
      - automatic1111
    environment:
      # Chat LLM via Ollama
      OLLAMA_BASE_URL: "http://ollama-gpu:11434"
      # Image gen config (can be changed in OWUI Admin → Settings → Images)
      ENABLE_IMAGE_GENERATION: "true"
      IMAGE_GENERATION_ENGINE: "comfyui"                 # default at boot; you can switch to automatic1111 in UI
      COMFYUI_BASE_URL: "http://comfyui:8188"
      AUTOMATIC1111_BASE_URL: "http://automatic1111:7860"
      # Optional defaults:
      # IMAGE_STEPS: "30"
      # IMAGE_SIZE: "768x768"
    volumes:
      - open-webui:/app/backend/data
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=demo"
      - "traefik.http.routers.chat.rule=Host(`${WEBUI_DOMAIN:-chat.lab.home-cloud.uk}`)"
      - "traefik.http.routers.chat.entrypoints=websecure"
      - "traefik.http.routers.chat.tls=true"
      - "traefik.http.services.chat.loadbalancer.server.port=8080"
    pull_policy: always
