version: "3.9"

volumes:
  n8n_storage:
  postgres_storage:
  ollama_storage:
  qdrant_storage:
  open-webui:
  comfy_workspace:   # ComfyUI models/workflows/outputs

networks:
  demo:
    name: demo        # fixed name so Portainer won't prefix it
    external: true    # ensure this network exists: `docker network create demo` (once)

services:
  postgres:
    image: postgres:16-alpine
    networks: ['demo']
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-ai}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change_me}
      - POSTGRES_DB=${POSTGRES_DB:-ai_db}
    volumes:
      - postgres_storage:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER:-ai} -d ${POSTGRES_DB:-ai_db}']
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:latest
    networks: ['demo']
    container_name: n8n
    restart: unless-stopped
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-ai}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-change_me}
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-changeme}
      - N8N_USER_MANAGEMENT_JWT_SECRET=${N8N_USER_MANAGEMENT_JWT_SECRET:-changeme}
    ports:
      - "5678:5678"
    volumes:
      - n8n_storage:/home/node/.n8n
      - ./n8n/backup:/backup
      - ./shared:/data/shared
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=demo"
      - "traefik.http.routers.n8n.rule=Host(`${N8N_DOMAIN:-n8n.lab.home-cloud.uk}`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls=true"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
    depends_on:
      postgres:
        condition: service_healthy

  ollama-gpu:
    image: ollama/ollama:latest
    container_name: ollama-gpu
    networks: ['demo']
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    # Note: 'deploy' is ignored by docker-compose, but fine under Swarm.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # Use built-in CLI for healthcheck (no curl/wget in image)
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama-pull-llama-gpu:
    image: ollama/ollama:latest
    container_name: ollama-pull-llama-gpu
    networks: ['demo']
    volumes:
      - ollama_storage:/root/.ollama
    entrypoint: /bin/sh
    command: ["-c", "sleep 3; OLLAMA_HOST=ollama-gpu:11434 ollama pull llama3.3"]
    depends_on:
      ollama-gpu:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    networks: ['demo']
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  # Image generation engine (GPU): ComfyUI
  comfyui:
    image: ghcr.io/ai-dock/comfyui:latest-cuda
    container_name: comfyui
    networks: ['demo']
    restart: unless-stopped
    # Keep internal; Open WebUI calls it at http://comfyui:8188
    volumes:
      - comfy_workspace:/workspace
      # Optional: bind specific folders if you want them on the host
      # - ./comfy/models:/workspace/storage
      # - ./comfy/output:/workspace/output
    environment:
      COMFYUI_PORT: "8188"
      WEB_ENABLE_AUTH: "false"
      WORKSPACE: "/workspace"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # If you want the ComfyUI web UI exposed via Traefik, uncomment:
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.docker.network=demo"
    #   - "traefik.http.routers.comfy.rule=Host(`comfy.lab.home-cloud.uk`)"
    #   - "traefik.http.routers.comfy.entrypoints=websecure"
    #   - "traefik.http.routers.comfy.tls=true"
    #   - "traefik.http.services.comfy.loadbalancer.server.port=8188"

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    networks: ['demo']
    restart: unless-stopped
    depends_on:
      - ollama-gpu
      - comfyui
    environment:
      # Chat LLM via Ollama
      OLLAMA_BASE_URL: "http://ollama-gpu:11434"
      # Image generation via ComfyUI (Open WebUI PersistentConfig)
      IMAGE_GENERATION_ENGINE: "comfyui"
      ENABLE_IMAGE_GENERATION: "true"
      COMFYUI_BASE_URL: "http://comfyui:8188"
      # Optional image defaults:
      # IMAGE_STEPS: "30"
      # IMAGE_SIZE: "768x768"
      # IMAGE_GENERATION_MODEL: ""
      # If you later add AUTOMATIC1111, you'd set AUTOMATIC1111_BASE_URL too.
    volumes:
      - open-webui:/app/backend/data
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=demo"
      - "traefik.http.routers.chat.rule=Host(`${WEBUI_DOMAIN:-chat.lab.home-cloud.uk}`)"
      - "traefik.http.routers.chat.entrypoints=websecure"
      - "traefik.http.routers.chat.tls=true"
      - "traefik.http.services.chat.loadbalancer.server.port=8080"
