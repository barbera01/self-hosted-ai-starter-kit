version: "3.9"

volumes:
  n8n_storage:
  postgres_storage:
  ollama_storage:
  qdrant_storage:
  open-webui:
  comfy_workspace:
  a1111_data:
  # Simple avatar volumes
  avatar_input:
  avatar_output:
  tts_output:

networks:
  demo:
    name: demo
    external: true

services:
  postgres:
    image: postgres:16-alpine
    networks: ['demo']
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-ai}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change_me}
      - POSTGRES_DB=${POSTGRES_DB:-ai_db}
    volumes:
      - postgres_storage:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER:-ai} -d ${POSTGRES_DB:-ai_db}']
      interval: 5s
      timeout: 5s
      retries: 10
    pull_policy: always

  n8n:
    image: n8nio/n8n:latest
    networks: ['demo']
    container_name: n8n
    restart: unless-stopped
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-ai}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-change_me}
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-changeme}
      - N8N_USER_MANAGEMENT_JWT_SECRET=${N8N_USER_MANAGEMENT_JWT_SECRET:-changeme}
    ports:
      - "5678:5678"
    volumes:
      - n8n_storage:/home/node/.n8n
      - ./n8n/backup:/backup
      - ./shared:/data/shared
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=demo"
      - "traefik.http.routers.n8n.rule=Host(`${N8N_DOMAIN:-n8n.lab.home-cloud.uk}`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls=true"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
    depends_on:
      postgres:
        condition: service_healthy
    pull_policy: always

  ollama-gpu:
    image: ollama/ollama:latest
    container_name: ollama-gpu
    networks: ['demo']
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 8G
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - OLLAMA_GPU_MEMORY_FRACTION=0.6
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    pull_policy: always

  ollama-pull-llama-gpu:
    image: ollama/ollama:latest
    container_name: ollama-pull-llama-gpu
    networks: ['demo']
    volumes:
      - ollama_storage:/root/.ollama
    entrypoint: /bin/sh
    command: ["-c", "sleep 3; OLLAMA_HOST=ollama-gpu:11434 ollama pull llama3.3"]
    depends_on:
      ollama-gpu:
        condition: service_healthy
    pull_policy: always

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    networks: ['demo']
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    pull_policy: always

  # ---- ComfyUI (Fixed indentation and GPU config) ----
  comfyui:
    image: ghcr.io/ai-dock/comfyui:latest-cuda
    container_name: comfyui
    networks: ['demo']
    restart: unless-stopped
    ports:
      - "8188:8188"
    volumes:
      - comfy_workspace:/workspace
      - ./comfy/custom_nodes:/opt/ComfyUI/custom_nodes
    environment:
      WEB_ENABLE_AUTH: "false"
      WEB_ENABLE_QUICKTUNNEL: "false"
      WEB_ENABLE_LOGIN: "false"
      WORKSPACE: "/workspace"
      # GPU environment variables
      NVIDIA_VISIBLE_DEVICES: "0"
      CUDA_VISIBLE_DEVICES: "0"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 10G
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=demo"
      - "traefik.http.routers.comfyui.rule=Host(`${COMFY_DOMAIN:-cui.lab.home-cloud.uk}`)"
      - "traefik.http.routers.comfyui.entrypoints=websecure"
      - "traefik.http.routers.comfyui.tls=true"
      - "traefik.http.services.comfyui.loadbalancer.server.port=8188"
    pull_policy: always

  # ---- AUTOMATIC1111 (GPU) ----
  automatic1111:
    image: ghcr.io/ai-dock/stable-diffusion-webui:latest-cuda
    container_name: automatic1111
    networks: ['demo']
    restart: unless-stopped
    environment:
      CLI_ARGS: "--listen --port 7860 --api --enable-insecure-extension-access --no-half-vae --medvram"
    ports:
      - "7860:7860"
    volumes:
      - a1111_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7860/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 8G
    pull_policy: always

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    networks: ['demo']
    restart: unless-stopped
    depends_on:
      ollama-gpu:
        condition: service_healthy
      automatic1111:
        condition: service_healthy
    environment:
      OLLAMA_BASE_URL: "http://ollama-gpu:11434"
      ENABLE_IMAGE_GENERATION: "true"
      IMAGE_GENERATION_ENGINE: "automatic1111"
      COMFYUI_BASE_URL: "http://comfyui:8188"
      AUTOMATIC1111_BASE_URL: "http://automatic1111:7860"
      WEBUI_NAME: "AI Chat & Image Generation"
      DEFAULT_USER_ROLE: "user"
      ENABLE_COMMUNITY_SHARING: "false"
    volumes:
      - open-webui:/app/backend/data
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=demo"
      - "traefik.http.routers.chat.rule=Host(`${WEBUI_DOMAIN:-chat.lab.home-cloud.uk}`)"
      - "traefik.http.routers.chat.entrypoints=websecure"
      - "traefik.http.routers.chat.tls=true"
      - "traefik.http.services.chat.loadbalancer.server.port=8080"
    pull_policy: always

  # ---- SIMPLE TTS Service (Only if you want it) ----
  simple-tts:
    image: python:3.11-slim
    container_name: simple-tts
    networks: ['demo']
    restart: unless-stopped
    ports:
      - "5002:5002"
    volumes:
      - tts_output:/app/output
      - ./simple-tts.py:/app/simple-tts.py
    working_dir: /app
    command: >
      bash -c "
      pip install fastapi uvicorn pydantic gtts &&
      python simple-tts.py
      "
    profiles: ["avatar"]  # Only start with: docker-compose --profile avatar up
    pull_policy: always

  # ---- SIMPLE Avatar API (Only if you want it) ----
  avatar-api:
    image: python:3.11-slim
    container_name: avatar-api
    networks: ['demo']
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - avatar_input:/app/input
      - avatar_output:/app/output
      - tts_output:/app/audio
      - ./shared:/app/shared
      - ./avatar-api.py:/app/avatar-api.py
    working_dir: /app
    environment:
      - OLLAMA_URL=http://ollama-gpu:11434
      - TTS_URL=http://simple-tts:5002
      - COMFYUI_URL=http://comfyui:8188
    command: >
      bash -c "
      pip install fastapi uvicorn aiohttp aiofiles python-multipart pillow &&
      python avatar-api.py
      "
    depends_on:
      - ollama-gpu
    profiles: ["avatar"]  # Only start with: docker-compose --profile avatar up
    pull_policy: always
