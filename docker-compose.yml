version: "3.9"

volumes:
  n8n_storage:
  postgres_storage:
  ollama_storage:
  qdrant_storage:
  open-webui:
  comfy_workspace:
  a1111_data:
  # New volumes for avatar generation
  avatar_models:
  avatar_input:
  avatar_output:
  tts_models:
  tts_output:
  sadtalker_models:

networks:
  demo:
    name: demo
    external: true

services:
  # Your existing services remain unchanged
  postgres:
    image: postgres:16-alpine
    networks: ['demo']
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-ai}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change_me}
      - POSTGRES_DB=${POSTGRES_DB:-ai_db}
    volumes:
      - postgres_storage:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER:-ai} -d ${POSTGRES_DB:-ai_db}']
      interval: 5s
      timeout: 5s
      retries: 10
    pull_policy: always

  n8n:
    image: n8nio/n8n:latest
    networks: ['demo']
    container_name: n8n
    restart: unless-stopped
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-ai}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-change_me}
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-changeme}
      - N8N_USER_MANAGEMENT_JWT_SECRET=${N8N_USER_MANAGEMENT_JWT_SECRET:-changeme}
    ports:
      - "5678:5678"
    volumes:
      - n8n_storage:/home/node/.n8n
      - ./n8n/backup:/backup
      - ./shared:/data/shared
      - avatar_input:/data/avatar_input  # New avatar input access
      - avatar_output:/data/avatar_output  # New avatar output access
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=demo"
      - "traefik.http.routers.n8n.rule=Host(`${N8N_DOMAIN:-n8n.lab.home-cloud.uk}`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls=true"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
    depends_on:
      postgres:
        condition: service_healthy
    pull_policy: always

  ollama-gpu:
    image: ollama/ollama:latest
    container_name: ollama-gpu
    networks: ['demo']
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        # RTX 3060 memory optimization
        limits:
          memory: 8G  # Reserve system RAM for other processes
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - OLLAMA_GPU_MEMORY_FRACTION=0.6  # Reserve 40% GPU memory for other services
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    pull_policy: always

  ollama-pull-llama-gpu:
    image: ollama/ollama:latest
    container_name: ollama-pull-llama-gpu
    networks: ['demo']
    volumes:
      - ollama_storage:/root/.ollama
    entrypoint: /bin/sh
    command: ["-c", "sleep 3; OLLAMA_HOST=ollama-gpu:11434 ollama pull llama3.3"]
    depends_on:
      ollama-gpu:
        condition: service_healthy
    pull_policy: always

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    networks: ['demo']
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    pull_policy: always

  # ---- ComfyUI (GPU) - Enhanced for avatar workflows ----
  comfyui:
    image: ghcr.io/ai-dock/comfyui:latest-cuda
    container_name: comfyui
    networks: ['demo']
    restart: unless-stopped
    ports:
      - "8188:8188"
    volumes:
      - comfy_workspace:/workspace
      - avatar_input:/workspace/input/avatars  # Direct avatar input access
      - avatar_output:/workspace/output/avatars  # Direct avatar output access
    environment:
      WEB_ENABLE_AUTH: "false"
      WEB_ENABLE_QUICKTUNNEL: "false"
      WEB_ENABLE_LOGIN: "false"
      WORKSPACE: "/workspace"
      # GPU memory optimization for RTX 3060
      PYTORCH_CUDA_ALLOC_CONF: "max_split_size_mb:512"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 10G
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=demo"
      - "traefik.http.routers.comfyui.rule=Host(`${COMFY_DOMAIN:-cui.lab.home-cloud.uk}`)"
      - "traefik.http.routers.comfyui.entrypoints=websecure"
      - "traefik.http.routers.comfyui.tls=true"
      - "traefik.http.services.comfyui.loadbalancer.server.port=8188"
    pull_policy: always

  # ---- AUTOMATIC1111 (GPU) ----
  automatic1111:
    image: ghcr.io/ai-dock/stable-diffusion-webui:latest-cuda
    container_name: automatic1111
    networks: ['demo']
    restart: unless-stopped
    environment:
      CLI_ARGS: "--listen --port 7860 --api --enable-insecure-extension-access --no-half-vae --medvram"  # Added --medvram for RTX 3060
    ports:
      - "7860:7860"
    volumes:
      - a1111_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7860/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 8G
    pull_policy: always

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    networks: ['demo']
    restart: unless-stopped
    depends_on:
      ollama-gpu:
        condition: service_healthy
      automatic1111:
        condition: service_healthy
    environment:
      OLLAMA_BASE_URL: "http://ollama-gpu:11434"
      ENABLE_IMAGE_GENERATION: "true"
      IMAGE_GENERATION_ENGINE: "comfyui"
      COMFYUI_BASE_URL: "http://comfyui:8188"
      AUTOMATIC1111_BASE_URL: "http://automatic1111:7860"
      WEBUI_NAME: "AI Chat & Image Generation"
      DEFAULT_USER_ROLE: "user"
      ENABLE_COMMUNITY_SHARING: "false"
    volumes:
      - open-webui:/app/backend/data
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=demo"
      - "traefik.http.routers.chat.rule=Host(`${WEBUI_DOMAIN:-chat.lab.home-cloud.uk}`)"
      - "traefik.http.routers.chat.entrypoints=websecure"
      - "traefik.http.routers.chat.tls=true"
      - "traefik.http.services.chat.loadbalancer.server.port=8080"
    pull_policy: always

  # ---- NEW: TTS Service (Optimized for RTX 3060) ----
  coqui-tts:
    image: ghcr.io/coqui-ai/tts:latest-gpu
    container_name: coqui-tts
    networks: ['demo']
    restart: unless-stopped
    ports:
      - "5002:5002"
    volumes:
      - tts_models:/app/tts_models
      - tts_output:/app/output
      - avatar_input:/app/avatar_input
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0
      # Optimize for 12GB VRAM
      - TTS_CACHE_PATH=/app/tts_models
      - TTS_SERVER_ENABLE_CORS=true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 6G  # Conservative memory limit
    command: ["tts-server", "--host", "0.0.0.0", "--port", "5002", "--use_cuda", "true"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=demo"
      - "traefik.http.routers.tts.rule=Host(`${TTS_DOMAIN:-tts.lab.home-cloud.uk}`)"
      - "traefik.http.routers.tts.entrypoints=websecure"
      - "traefik.http.routers.tts.tls=true"
      - "traefik.http.services.tts.loadbalancer.server.port=5002"
    pull_policy: always

  # ---- NEW: SadTalker Avatar Generation (RTX 3060 Optimized) ----
  sadtalker:
    image: winglian/sadtalker:latest
    container_name: sadtalker
    networks: ['demo']
    restart: unless-stopped
    ports:
      - "7860:7860"  # Different port from A1111
    volumes:
      - sadtalker_models:/app/checkpoints
      - avatar_input:/app/examples
      - avatar_output:/app/results
      - tts_output:/app/audio_input
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
      # RTX 3060 12GB optimizations
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:2048
      - CUDA_LAUNCH_BLOCKING=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 12G
    command: >
      bash -c "
      cd /app &&
      python app.py --ip 0.0.0.0 --port 7860 --device cuda
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/"]
      interval: 45s
      timeout: 15s
      retries: 3
      start_period: 180s  # SadTalker takes time to load models
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=demo"
      - "traefik.http.routers.sadtalker.rule=Host(`${SADTALKER_DOMAIN:-avatar.lab.home-cloud.uk}`)"
      - "traefik.http.routers.sadtalker.entrypoints=websecure"
      - "traefik.http.routers.sadtalker.tls=true"
      - "traefik.http.services.sadtalker.loadbalancer.server.port=7860"
    pull_policy: always

  # ---- NEW: Avatar Pipeline Coordinator ----
  avatar-coordinator:
    build: 
      context: ./avatar-coordinator
      dockerfile: Dockerfile
    container_name: avatar-coordinator
    networks: ['demo']
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - avatar_input:/app/input
      - avatar_output:/app/output
      - tts_output:/app/audio
      - ./shared:/app/shared
    environment:
      # Service URLs for internal communication
      - OLLAMA_URL=http://ollama-gpu:11434
      - TTS_URL=http://coqui-tts:5002
      - SADTALKER_URL=http://sadtalker:7860
      - COMFYUI_URL=http://comfyui:8188
      # RTX 3060 specific settings
      - GPU_MEMORY_FRACTION=0.8
      - MAX_CONCURRENT_JOBS=2  # Conservative for 12GB VRAM
      - PROCESSING_TIMEOUT=300  # 5 minutes timeout
    depends_on:
      - coqui-tts
      - sadtalker
      - ollama-gpu
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=demo"
      - "traefik.http.routers.avatar-api.rule=Host(`${AVATAR_API_DOMAIN:-avatar-api.lab.home-cloud.uk}`)"
      - "traefik.http.routers.avatar-api.entrypoints=websecure"
      - "traefik.http.routers.avatar-api.tls=true"
      - "traefik.http.services.avatar-api.loadbalancer.server.port=8090"

  # ---- Model Downloader (Run once to populate models) ----
  model-downloader:
    image: python:3.11-slim
    container_name: model-downloader
    networks: ['demo']
    volumes:
      - sadtalker_models:/app/sadtalker_models
      - tts_models:/app/tts_models
      - ./download-models.sh:/app/download-models.sh
    environment:
      - HF_HOME=/app/hf_cache
    command: >
      bash -c "
      apt-get update && apt-get install -y wget curl git &&
      pip install huggingface_hub &&
      chmod +x /app/download-models.sh &&
      /app/download-models.sh &&
      echo 'Models downloaded successfully'
      "
    restart: "no"  # Run once only
    profiles: ["setup"]  # Only run when explicitly requested
